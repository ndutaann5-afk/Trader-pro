<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trader Pro</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #070a0f;
  color: #f4f7fb;
  font-family: Arial, sans-serif;
}

.app {
  width: 100%;
  max-width: 720px;
  margin: auto;
  padding: 18px 14px 40px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.logo {
  font-size: 25px;
  font-weight: 800;
}

.logo span {
  color: #19d681;
}

.status {
  padding: 7px 11px;
  border-radius: 20px;
  background: #151b24;
  color: #aeb8c5;
  font-size: 12px;
}

.card {
  background: #10151d;
  border: 1px solid #252e3b;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 13px;
}

.label {
  color: #8793a2;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .7px;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #303a48;
  background: #080c12;
  color: white;
  font-size: 15px;
}

.price {
  font-size: 30px;
  font-weight: 800;
  margin-top: 10px;
  word-break: break-all;
}

.big-digit {
  text-align: center;
  font-size: 54px;
  font-weight: 900;
  margin: 5px 0;
}

.center {
  text-align: center;
}

.muted {
  color: #7f8b9b;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

button {
  flex: 1;
  padding: 15px;
  border: 0;
  border-radius: 11px;
  font-size: 15px;
  font-weight: 800;
}

#startButton {
  background: #19d681;
  color: #03130b;
}

#stopButton {
  background: #252e3a;
  color: white;
}

.ai {
  border-left: 4px solid #19d681;
}

.confidence {
  font-size: 32px;
  font-weight: 900;
  margin: 5px 0 12px;
}

.insight {
  line-height: 1.65;
  color: #c3ccd7;
}

.match-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.match {
  background: #080c12;
  border-radius: 12px;
  padding: 15px;
}

.match-title {
  color: #8793a2;
  font-size: 12px;
}

.match-value {
  font-size: 26px;
  font-weight: 800;
  margin-top: 6px;
}

.digits {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
}

.digit-card {
  background: #080c12;
  border: 1px solid #27313e;
  border-radius: 9px;
  padding: 9px 3px;
  text-align: center;
}

.digit-card strong {
  display: block;
  font-size: 17px;
}

.digit-card small {
  color: #8793a2;
}

.tick-list {
  max-height: 190px;
  overflow-y: auto;
  font-family: monospace;
  line-height: 1.7;
  color: #aeb8c5;
}

.error {
  color: #ff7777;
}

@media (max-width: 430px) {
  .app {
    padding: 15px 11px 30px;
  }

  .logo {
    font-size: 22px;
  }

  .price {
    font-size: 25px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">
      TRADER <span>PRO</span>
    </div>

    <div id="status" class="status">
      ● Ready
    </div>
  </div>


  <div class="card">

    <div class="label">
      Market
    </div>

    <select id="marketSelect">
      <option value="">
        Loading markets...
      </option>
    </select>

    <div class="label" style="margin-top:16px;">
      Live price
    </div>

    <div id="price" class="price">
      —
    </div>

  </div>


  <div class="card center">

    <div class="label">
      Latest last digit
    </div>

    <div id="lastDigit" class="big-digit">
      —
    </div>

    <div id="tickCount" class="muted">
      0 ticks analysed
    </div>

  </div>


  <div class="card ai">

    <div class="label">
      AI / Statistical Insight
    </div>

    <div id="confidence"
         class="confidence">
      —
    </div>

    <div id="insight" class="insight">
      Start Analysis to begin collecting
      live Deriv tick data.
    </div>

  </div>


  <div class="card">

    <div class="label">
      Matches / Differs
    </div>

    <div class="match-grid">

      <div class="match">
        <div class="match-title">
          Matches
        </div>

        <div id="matches"
             class="match-value">
          —
        </div>
      </div>

      <div class="match">
        <div class="match-title">
          Differs
        </div>

        <div id="differs"
             class="match-value">
          —
        </div>
      </div>

    </div>

  </div>


  <div class="card">

    <div class="label">
      Digit Distribution
    </div>

    <div id="distribution"
         class="digits">
    </div>

  </div>


  <div class="card">

    <div class="label">
      Recent Ticks
    </div>

    <div id="ticks"
         class="tick-list">
      No ticks yet.
    </div>

  </div>


  <div class="buttons">

    <button id="startButton">
      START ANALYSIS
    </button>

    <button id="stopButton">
      STOP
    </button>

  </div>

</div>


<script>

const WS_URL =
  "wss://api.derivws.com/trading/v1/options/ws/public";

let socket = null;

let running = false;

let reconnectTimer = null;

let reconnectAttempts = 0;

let selectedSymbol = "";

let tickData = [];

let counts = Array(10).fill(0);

const MAX_TICKS = 200;

const RECENT_TICKS = 30;


const status =
  document.getElementById(
    "status"
  );

const marketSelect =
  document.getElementById(
    "marketSelect"
  );

const price =
  document.getElementById(
    "price"
  );

const lastDigit =
  document.getElementById(
    "lastDigit"
  );

const tickCount =
  document.getElementById(
    "tickCount"
  );

const confidence =
  document.getElementById(
    "confidence"
  );

const insight =
  document.getElementById(
    "insight"
  );

const matches =
  document.getElementById(
    "matches"
  );

const differs =
  document.getElementById(
    "differs"
  );

const distribution =
  document.getElementById(
    "distribution"
  );

const ticks =
  document.getElementById(
    "ticks"
  );


function setStatus(text) {

  status.textContent = text;

  console.log(
    "[Trader Pro]",
    text
  );

}


function send(request) {

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {
    return false;
  }

  try {

    socket.send(
      JSON.stringify(request)
    );

    return true;

  } catch (error) {

    console.error(error);

    return false;

  }

}


function connect() {

  clearTimeout(
    reconnectTimer
  );

  setStatus(
    "● Connecting"
  );

  try {

    socket =
      new WebSocket(
        WS_URL
      );

  } catch (error) {

    console.error(error);

    setStatus(
      "● Connection failed"
    );

    scheduleReconnect();

    return;

  }


  socket.onopen =
    function() {

      reconnectAttempts = 0;

      setStatus(
        "● Connected"
      );

      requestMarkets();

    };


  socket.onmessage =
    function(event) {

      handleMessage(
        event.data
      );

    };


  socket.onerror =
    function(error) {

      console.error(
        "WebSocket error",
        error
      );

      setStatus(
        "● Connection error"
      );

    };


  socket.onclose =
    function(event) {

      console.log(
        "Closed:",
        event.code,
        event.reason
      );

      setStatus(
        "● Disconnected " +
        event.code
      );

      if (running) {

        scheduleReconnect();

      }

    };

}


function scheduleReconnect() {

  if (!running) {
    return;
  }

  clearTimeout(
    reconnectTimer
  );

  reconnectAttempts++;

  const delay =
    Math.min(
      1000 *
      Math.pow(
        2,
        reconnectAttempts - 1
      ),
      15000
    );

  setStatus(
    "● Reconnecting"
  );

  reconnectTimer =
    setTimeout(
      connect,
      delay
    );

}


function requestMarkets() {

  send({

    active_symbols:
      "brief",

    product_type:
      "basic",

    req_id:
      1

  });

}


function handleMessage(raw) {

  let data;

  try {

    data =
      JSON.parse(
        raw
      );

  } catch (error) {

    console.error(
      "Invalid message:",
      raw
    );

    return;

  }


  console.log(
    "Deriv:",
    data
  );


  if (data.error) {

    console.error(
      "Deriv API error:",
      data.error
    );

    setStatus(
      "● API error"
    );

    insight.textContent =
      data.error.message ||
      "Deriv returned an error.";

    return;

  }


  if (
    data.msg_type ===
    "active_symbols"
  ) {

    loadMarkets(
      data.active_symbols
    );

    return;

  }


  if (
    data.msg_type ===
    "tick"
  ) {

    processTick(
      data.tick
    );

  }

}


function loadMarkets(markets) {

  if (
    !Array.isArray(
      markets
    )
  ) {

    return;

  }


  const usable =
    markets.filter(
      item =>
        item &&
        (
          item.symbol ||
          item.underlying_symbol
        )
    );


  marketSelect.innerHTML =
    "";


  usable
    .slice(0, 100)
    .forEach(
      function(item) {

        const symbol =
          item.symbol ||
          item.underlying_symbol;

        const name =
          item.display_name ||
          item.underlying_symbol_name ||
          symbol;


        const option =
          document.createElement(
            "option"
          );

        option.value =
          symbol;

        option.textContent =
          name +
          " (" +
          symbol +
          ")";

        marketSelect.appendChild(
          option
        );

      }
    );


  if (
    !marketSelect.options.length
  ) {

    setStatus(
      "● No markets received"
    );

    return;

  }


  selectedSymbol =
    marketSelect.value;


  setStatus(
    "● Markets loaded"
  );

  subscribe();

}


function subscribe() {

  if (!selectedSymbol) {
    return;
  }


  tickData = [];

  counts =
    Array(10).fill(0);


  price.textContent =
    "—";

  lastDigit.textContent =
    "—";

  tickCount.textContent =
    "0 ticks analysed";


  send({

    ticks:
      selectedSymbol,

    subscribe:
      1,

    req_id:
      2

  });


  setStatus(
    "● LIVE " +
    selectedSymbol
  );

}


function processTick(tick) {

  if (!tick) {
    return;
  }


  const value =
    Number(
      tick.quote
    );


  if (!Number.isFinite(value)) {
    return;
  }


  const text =
    String(
      tick.quote
    );


  let decimals =
    text.split(".")[1] ||
    "";


  if (!decimals.length) {

    decimals = "0";

  }


  const digit =
    Number(
      decimals[
        decimals.length - 1
      ]
    );


  if (
    !Number.isInteger(
      digit
    )
  ) {

    return;

  }


  tickData.push({

    price:
      value,

    digit:
      digit,

    time:
      Date.now()

  });


  counts[digit]++;


  if (
    tickData.length >
    MAX_TICKS
  ) {

    const removed =
      tickData.shift();

    counts[
      removed.digit
    ]--;

  }


  updateAnalysis();

}


function updateAnalysis() {

  const total =
    tickData.length;


  if (!total) {
    return;
  }


  const latest =
    tickData[
      total - 1
    ];


  price.textContent =
    latest.price;

  lastDigit.textContent =
    latest.digit;

  tickCount.textContent =
    total +
    " ticks analysed";


  let dominant =
    0;


  for (
    let i = 1;
    i < 10;
    i++
  ) {

    if (
      counts[i] >
      counts[dominant]
    ) {

      dominant = i;

    }

  }


  const dominantPercent =
    counts[dominant] /
    total *
    100;


  const recent =
    tickData.slice(
      -RECENT_TICKS
    );


  const recentCounts =
    Array(10).fill(0);


  recent.forEach(
    item => {

      recentCounts[
        item.digit
      ]++;

    }
  );


  let recentDominant =
    0;


  for (
    let i = 1;
    i < 10;
    i++
  ) {

    if (
      recentCounts[i] >
      recentCounts[
        recentDominant
      ]
    ) {

      recentDominant = i;

    }

  }


  const recentPercent =
    recent.length
      ? recentCounts[
          recentDominant
        ] /
        recent.length *
        100
      : 0;


  let modelConfidence =
    50;


  if (
    dominant ===
    recentDominant
  ) {

    modelConfidence +=
      15;

  }


  if (
    dominantPercent >=
    15
  ) {

    modelConfidence +=
      10;

  }


  if (
    recentPercent >=
    20
  ) {

    modelConfidence +=
      10;

  }


  if (
    total >= 100
  ) {

    modelConfidence +=
      5;

  }


  modelConfidence =
    Math.min(
      modelConfidence,
      90
    );


  confidence.textContent =
    modelConfidence +
    "%";


  insight.innerHTML =

    "Dominant digit: <strong>" +
    dominant +
    "</strong><br>" +

    "Recent dominant: <strong>" +
    recentDominant +
    "</strong><br>" +

    "Dominant frequency: <strong>" +
    dominantPercent.toFixed(1) +
    "%</strong><br>" +

    "Recent frequency: <strong>" +
    recentPercent.toFixed(1) +
    "%</strong><br><br>" +

    "This confidence score measures " +
    "agreement within the observed sample. " +
    "It is not a guaranteed probability " +
    "of the next contract outcome.";


  matches.textContent =
    dominantPercent.toFixed(1) +
    "%";


  differs.textContent =
    (
      100 -
      dominantPercent
    ).toFixed(1) +
    "%";


  distribution.innerHTML =
    counts
      .map(
        function(count, digit) {

          const percent =
            count /
            total *
            100;

          return `
            <div class="digit-card">
              <strong>${digit}</strong>
              <small>
                ${percent.toFixed(1)}%
              </small>
            </div>
          `;

        }
      )
      .join("");


  ticks.innerHTML =
    tickData
      .slice(-30)
      .reverse()
      .map(
        item =>
          item.price +
          " → " +
          item.digit
      )
      .join("<br>");


  setStatus(
    "● LIVE " +
    selectedSymbol
  );

}


marketSelect.addEventListener(
  "change",
  function() {

    selectedSymbol =
      marketSelect.value;

    if (running) {

      subscribe();

    }

  }
);


document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    function() {

      if (running) {
        return;
      }

      running = true;

      connect();

    }
  );


document
  .getElementById(
    "stopButton"
  )
  .addEventListener(
    "click",
    function() {

      running = false;

      clearTimeout(
        reconnectTimer
      );

      if (socket) {

        try {
          socket.close();
        } catch (error) {}

      }

      socket = null;

      setStatus(
        "● Stopped"
      );

    }
  );


for (
  let i = 0;
  i < 10;
  i++
) {

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "digit-card";

  box.innerHTML =
    "<strong>" +
    i +
    "</strong>" +
    "<small>0.0%</small>";

  distribution.appendChild(
    box
  );

}

</script>

</body>
</html>
