<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deriv Matches & Differs Analyzer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header>
    <h1>DERIV ANALYZER</h1>
    <p>Matches & Differs</p>
    <div id="connection" class="status">Connecting...</div>
  </header>

  <section class="panel">
    <h2>Live Market</h2>
    <div id="market" class="value">Connecting...</div>
  </section>

  <section class="panel target-panel">
    <h2>Current Analysis</h2>

    <div class="target">
      <span>Target Digit</span>
      <strong id="targetDigit">—</strong>
    </div>

    <div class="stats">

      <div>
        <span>MATCHES</span>
        <strong id="matchesChance">—</strong>
      </div>

      <div>
        <span>DIFFERS</span>
        <strong id="differsChance">—</strong>
      </div>

    </div>

  </section>

  <section class="panel">
    <h2>Confidence</h2>

    <div id="confidence" class="confidence">
      —
    </div>

    <div id="signal" class="signal">
      WAIT
    </div>

    <div id="message" class="message">
      Collecting data...
    </div>
  </section>

  <section class="panel">
    <h2>Digit Distribution</h2>

    <div id="digitDistribution" class="distribution">
      Loading...
    </div>
  </section>

  <section class="panel">
    <h2>Statistics</h2>

    <div class="stat-row">
      <span>Sample Size</span>
      <strong id="sampleSize">0</strong>
    </div>

    <div class="stat-row">
      <span>Hot Digit</span>
      <strong id="hotDigit">—</strong>
    </div>

    <div class="stat-row">
      <span>Cold Digit</span>
      <strong id="coldDigit">—</strong>
    </div>

    <div class="stat-row">
      <span>Current Streak</span>
      <strong id="streak">—</strong>
    </div>
  </section>

  <section class="panel">
    <h2>Recent Digits</h2>

    <div id="digitHistory" class="history">
      —
    </div>
  </section>

  <button onclick="analyzeTrade()">
    ANALYZE
  </button>

</div>

<script src="script.js"></script>

</body>
</html>
