<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trader Pro</title>

<style>
body{
  margin:0;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}
.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}
h1{text-align:center;margin:5px}
.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:20px;
}
.card{
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:16px;
  margin-bottom:15px;
}
label{
  display:block;
  color:#aaa;
  font-size:14px;
  margin-bottom:7px;
}
select,button{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#181818;
  color:white;
  font-size:16px;
}
button{
  background:white;
  color:black;
  font-weight:bold;
}
.connection{
  text-align:center;
  padding:15px;
  border-radius:12px;
  background:#181818;
}
.connection-status{
  font-size:21px;
  font-weight:bold;
}
.details{
  margin-top:8px;
  color:#aaa;
  font-size:13px;
}
.signal{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  padding:25px 5px;
}
.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.stat{
  background:#181818;
  border-radius:10px;
  padding:12px;
  text-align:center;
}
.stat span{
  display:block;
  color:#777;
  font-size:12px;
  margin-bottom:5px;
}
.stat strong{font-size:20px}
.log{
  background:#080808;
  padding:12px;
  border-radius:10px;
  font-size:12px;
  color:#aaa;
  line-height:1.7;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="container">

<h1>Trader Pro</h1>

<div class="subtitle">
Expert Pattern Engine • One Round Mode
</div>

<div class="card">

<label>Volatility Market</label>

<select id="symbol">
<option value="1HZ10V">Volatility 10 (1s)</option>
<option value="1HZ25V">Volatility 25 (1s)</option>
<option value="1HZ50V">Volatility 50 (1s)</option>
<option value="1HZ75V">Volatility 75 (1s)</option>
<option value="1HZ100V">Volatility 100 (1s)</option>
<option value="R_10">Volatility 10</option>
<option value="R_25">Volatility 25</option>
<option value="R_50">Volatility 50</option>
<option value="R_75">Volatility 75</option>
<option value="R_100">Volatility 100</option>
</select>

<label>Contract Duration</label>

<select id="duration">
<option value="1">1 Tick</option>
<option value="2">2 Ticks</option>
<option value="3">3 Ticks</option>
<option value="4">4 Ticks</option>
<option value="5">5 Ticks</option>
<option value="6">6 Ticks</option>
<option value="7">7 Ticks</option>
<option value="8">8 Ticks</option>
<option value="9">9 Ticks</option>
<option value="10">10 Ticks</option>
</select>

<button id="startBtn">
START EXPERT ANALYSIS
</button>

</div>


<div class="card">

<div class="connection">

<div id="connectionStatus"
class="connection-status">
🟡 CONNECTING
</div>

<div id="connectionDetails"
class="details">
Opening Deriv connection...
</div>

</div>

</div>


<div class="card">

<div class="signal">
<div id="signal">
WAITING...
</div>
</div>

<div id="status"
style="text-align:center;color:#aaa">
Loading...
</div>

</div>


<div class="card">

<div class="stats">

<div class="stat">
<span>Historical</span>
<strong id="historical">0</strong>
</div>

<div class="stat">
<span>Live ticks</span>
<strong id="liveTicks">0</strong>
</div>

<div class="stat">
<span>Signals</span>
<strong id="signals">0</strong>
</div>

<div class="stat">
<span>Wins</span>
<strong id="wins">0</strong>
</div>

<div class="stat">
<span>Losses</span>
<strong id="losses">0</strong>
</div>

<div class="stat">
<span>Hit rate</span>
<strong id="hitRate">0%</strong>
</div>

</div>

</div>


<div class="card">

<b>Connection Log</b>

<div id="log" class="log">
Starting...
</div>

</div>

</div>


<script>

const WS_URL =
"wss://api.derivws.com/trading/v1/options/ws/public";

let ws=null;

let history=[];
let live=[];

let running=false;

let signalDigit=null;
let signalStart=0;

let duration=1;

let signals=0;
let wins=0;
let losses=0;

let lastLossDigit=null;

let reconnectTimer=null;

let pipSize=2;


const symbolEl=
document.getElementById("symbol");

const durationEl=
document.getElementById("duration");

const startBtn=
document.getElementById("startBtn");

const connectionStatus=
document.getElementById("connectionStatus");

const connectionDetails=
document.getElementById("connectionDetails");

const signalEl=
document.getElementById("signal");

const statusEl=
document.getElementById("status");

const logEl=
document.getElementById("log");


function log(message){

  const time=
  new Date().toLocaleTimeString();

  logEl.innerHTML=
  time+" — "+message+
  "<br>"+logEl.innerHTML;

}


function setConnection(state,details){

  connectionStatus.textContent=state;

  connectionDetails.textContent=details;

}


function digitFromQuote(quote){

  const decimals=
  Number.isFinite(Number(pipSize))
  ? Number(pipSize)
  : 2;

  const text=
  Number(quote).toFixed(decimals);

  const parts=
  text.split(".");

  const decimal=
  parts[1] || "0";

  return Number(
    decimal.charAt(
      decimal.length-1
    )
  );

}


function connect(){

  clearTimeout(reconnectTimer);

  setConnection(
    "🟡 CONNECTING",
    "Opening Deriv WebSocket..."
  );

  statusEl.textContent=
  "Connecting to Deriv...";

  log("Opening WebSocket");

  try{

    ws=
    new WebSocket(WS_URL);

  }catch(error){

    setConnection(
      "🔴 ERROR",
      error.message
    );

    log(
      "WebSocket creation failed: "+
      error.message
    );

    scheduleReconnect();

    return;

  }


  ws.onopen=function(){

    setConnection(
      "🟢 CONNECTED",
      "Connected to Deriv • Requesting market history"
    );

    statusEl.textContent=
    "Connected • Loading market history";

    log("WebSocket connected");

    requestHistory();

  };


  ws.onmessage=function(event){

    let data;

    try{

      data=
      JSON.parse(event.data);

    }catch(error){

      log("Invalid server message");

      return;

    }


    if(data.error){

      setConnection(
        "🔴 DERIV ERROR",
        data.error.message || "Unknown error"
      );

      statusEl.textContent=
      "Deriv returned an error";

      log(
        "Deriv error: "+
        (data.error.message || "Unknown")
      );

      return;

    }


    if(data.history){

      history=[];

      if(data.pip_size!==undefined){

        pipSize=
        Number(data.pip_size);

      }

      const prices=
      data.history.prices || [];

      for(const price of prices){

        history.push(
          digitFromQuote(price)
        );

      }

      document.getElementById(
        "historical"
      ).textContent=
      history.length;

      log(
        "History received: "+
        history.length+
        " ticks"
      );

      setConnection(
        "🟢 CONNECTED",
        "History loaded • Starting live tick stream"
      );

      requestTicks();

      return;

    }


    if(data.tick){

      const digit=
      digitFromQuote(
        data.tick.quote
      );

      live.push(digit);

      if(live.length>1500){
        live.shift();
      }

      document.getElementById(
        "liveTicks"
      ).textContent=
      live.length;

      setConnection(
        "🟢 LIVE",
        "Receiving live Deriv ticks"
      );

      statusEl.textContent=
      "LIVE • Last digit: "+
      digit;

      log(
        "LIVE tick • digit "+
        digit
      );

      processTick();

      return;

    }

  };


  ws.onerror=function(){

    setConnection(
      "🔴 CONNECTION ERROR",
      "WebSocket error"
    );

    statusEl.textContent=
    "Connection error";

    log("WebSocket error");

  };


  ws.onclose=function(event){

    setConnection(
      "🔴 DISCONNECTED",
      "Connection closed"
    );

    statusEl.textContent=
    "Connection closed";

    log(
      "Connection closed • code "+
      event.code
    );

    scheduleReconnect();

  };

}


function requestHistory(){

  if(
    !ws ||
    ws.readyState!==WebSocket.OPEN
  ){

    log("Cannot request history: socket not open");

    return;

  }

  const symbol=
  symbolEl.value;

  log(
    "Requesting 1000 ticks for "+
    symbol
  );

  ws.send(
    JSON.stringify({

      ticks_history:symbol,

      end:"latest",

      count:1000,

      style:"ticks",

      subscribe:0

    })
  );

}


function requestTicks(){

  if(
    !ws ||
    ws.readyState!==WebSocket.OPEN
  ){

    log("Cannot start live stream: socket not open");

    return;

  }

  const symbol=
  symbolEl.value;

  ws.send(
    JSON.stringify({

      ticks:symbol,

      subscribe:1

    })
  );

  log(
    "Live tick subscription requested"
  );

}


function scheduleReconnect(){

  clearTimeout(reconnectTimer);

  reconnectTimer=
  setTimeout(
    function(){

      log("Attempting reconnect...");

      connect();

    },
    3000
  );

}


function processTick(){

  if(!running){
    return;
  }

  if(signalDigit===null){
    analyze();
    return;
  }

  const elapsed=
  live.length-signalStart;

  if(elapsed>=duration){

    const finalIndex=
    signalStart+duration-1;

    const finalDigit=
    live[finalIndex];

    if(finalDigit===signalDigit){

      wins++;

      log(
        "WIN • Matches "+
        signalDigit+
        " • Final digit "+
        finalDigit
      );

    }else{

      losses++;

      lastLossDigit=
      signalDigit;

      log(
        "LOSS • Matches "+
        signalDigit+
        " • Final digit "+
        finalDigit
      );

    }

    signals++;

    signalDigit=null;

    updateStats();

    signalEl.textContent=
    "ANALYZING...";

    setTimeout(
      function(){

        if(running){
          analyze();
        }

      },
      1200
    );

  }

}


function analyze(){

  if(!running){
    return;
  }

  const combined=
  history
  .concat(live)
  .slice(-1200);


  if(combined.length<500){

    signalEl.textContent=
    "LOADING...";

    statusEl.textContent=
    "Waiting for enough market data";

    return;

  }


  const count=
  Array(10).fill(0);

  for(const d of combined){
    count[d]++;
  }


  const recent=
  combined.slice(-100);

  const recentCount=
  Array(10).fill(0);

  for(const d of recent){
    recentCount[d]++;
  }


  const candidates=[];


  for(let d=0;d<10;d++){

    if(d===lastLossDigit){
      continue;
    }

    const longRate=
    count[d]/combined.length;

    const recentRate=
    recentCount[d]/recent.length;

    candidates.push({

      digit:d,

      long:longRate,

      recent:recentRate,

      score:
      longRate*0.5+
      recentRate*0.5

    });

  }


  candidates.sort(
    (a,b)=>
    b.score-a.score
  );


  const best=
  candidates[0];

  const second=
  candidates[1];


  const qualified=
  best.long>=0.105 &&
  best.recent>=0.105 &&
  best.long-second.long>=0.01;


  if(!qualified){

    signalEl.textContent=
    "NO CLEAR EDGE";

    statusEl.textContent=
    "Analyzing • No qualifying digit";

    return;

  }


  signalDigit=
  best.digit;

  signalStart=
  live.length;

  signalEl.textContent=
  "MATCHES "+
  signalDigit;

  statusEl.textContent=
  "QUALIFIED • 1 round • "+
  duration+
  " tick";

  log(
    "SIGNAL: MATCHES "+
    signalDigit
  );

}


function updateStats(){

  document.getElementById(
    "signals"
  ).textContent=signals;

  document.getElementById(
    "wins"
  ).textContent=wins;

  document.getElementById(
    "losses"
  ).textContent=losses;

  const completed=
  wins+losses;

  const rate=
  completed?
  (wins/completed*100).toFixed(1):
  "0";

  document.getElementById(
    "hitRate"
  ).textContent=
  rate+"%";

}


startBtn.onclick=function(){

  duration=
  Number(durationEl.value);

  if(!running){

    running=true;

    startBtn.textContent=
    "STOP EXPERT ANALYSIS";

    signalEl.textContent=
    "ANALYZING...";

    statusEl.textContent=
    "Scanning live market...";

    analyze();

  }else{

    running=false;

    signalDigit=null;

    startBtn.textContent=
    "START EXPERT ANALYSIS";

    signalEl.textContent=
    "STOPPED";

    statusEl.textContent=
    "Analysis stopped";

  }

};


symbolEl.onchange=function(){

  history=[];
  live=[];

  signalDigit=null;

  document.getElementById(
    "historical"
  ).textContent="0";

  document.getElementById(
    "liveTicks"
  ).textContent="0";

  if(ws){

    try{
      ws.close();
    }catch(e){}

  }

  connect();

};


connect();

</script>

</body>
</html>
