<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trader Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b10;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      color: #8d98a8;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    .card {
      background: #11161e;
      border: 1px solid #252c36;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      color: #9ca8b8;
      font-size: 13px;
      margin-bottom: 7px;
    }

    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #303846;
      background: #080b10;
      color: white;
      font-size: 15px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7ee787;
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #7ee787;
    }

    .main-result {
      text-align: center;
      padding: 25px 10px;
    }

    .small-title {
      color: #8995a5;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .digit {
      font-size: 76px;
      font-weight: bold;
      margin: 8px 0;
    }

    .edge {
      font-size: 17px;
      font-weight: bold;
    }

    .confidence {
      margin-top: 7px;
      color: #b8c2cf;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: #0b0f15;
      border-radius: 10px;
      padding: 13px;
    }

    .stat-name {
      color: #8995a5;
      font-size: 12px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: bold;
      margin-top: 5px;
    }

    .timer {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 8px 0 15px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
    }

    button:active {
      transform: scale(0.98);
    }

    button.secondary {
      background: #252c36;
      color: white;
    }

    button:disabled {
      opacity: 0.45;
    }

    .feed {
      max-height: 180px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 13px;
      color: #aeb8c6;
    }

    .feed div {
      padding: 5px 0;
      border-bottom: 1px solid #1c222b;
    }

    .digits {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-top: 10px;
    }

    .digit-box {
      background: #0b0f15;
      border-radius: 6px;
      text-align: center;
      padding: 8px 2px;
      font-size: 12px;
    }

    .digit-box strong {
      display: block;
      font-size: 14px;
      margin-top: 3px;
    }

    .insight {
      color: #b9c3d0;
      line-height: 1.5;
      font-size: 14px;
    }

    .error {
      color: #ff7b72;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>TRADER PRO</h1>
  <div class="subtitle">Deriv Volatility Matches Edge Engine</div>

  <div class="card">
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="status">Connecting to Deriv...</span>
    </div>
  </div>

  <div class="card">

    <label>VOLATILITY INDEX</label>

    <select id="market">
      <option value="1HZ100V">Volatility 100 (1s)</option>
      <option value="1HZ75V">Volatility 75 (1s)</option>
      <option value="1HZ50V">Volatility 50 (1s)</option>
      <option value="1HZ25V">Volatility 25 (1s)</option>
      <option value="1HZ10V">Volatility 10 (1s)</option>
      <option value="R_100">Volatility 100</option>
      <option value="R_75">Volatility 75</option>
      <option value="R_50">Volatility 50</option>
      <option value="R_25">Volatility 25</option>
      <option value="R_10">Volatility 10</option>
    </select>

  </div>

  <div class="card">

    <label>ANALYSIS WINDOW</label>

    <select id="window">
      <option value="30000">30 Seconds</option>
      <option value="60000" selected>1 Minute</option>
      <option value="120000">2 Minutes</option>
      <option value="300000">5 Minutes</option>
    </select>

    <div class="timer" id="timer">01:00</div>

    <div class="buttons">
      <button id="startBtn">START</button>
      <button id="nextBtn" class="secondary" disabled>NEXT ANALYSIS</button>
    </div>

  </div>

  <div class="card main-result">

    <div class="small-title">MATCHES CANDIDATE</div>

    <div class="digit" id="candidate">—</div>

    <div class="edge" id="edge">WAITING</div>

    <div class="confidence">
      Confidence: <span id="confidence">—</span>
    </div>

  </div>

  <div class="card">

    <div class="grid">

      <div class="stat">
        <div class="stat-name">TICKS</div>
        <div class="stat-value" id="sample">0</div>
      </div>

      <div class="stat">
        <div class="stat-name">MATCHES RATE</div>
        <div class="stat-value" id="matches">—</div>
      </div>

      <div class="stat">
        <div class="stat-name">DIFFERS RATE</div>
        <div class="stat-value" id="differs">—</div>
      </div>

      <div class="stat">
        <div class="stat-name">EDGE GAP</div>
        <div class="stat-value" id="gap">—</div>
      </div>

    </div>

  </div>

  <div class="card">

    <div class="small-title">DIGIT DISTRIBUTION</div>

    <div class="digits" id="digits"></div>

  </div>

  <div class="card">

    <div class="small-title">AI / STATISTICAL INSIGHT</div>

    <p class="insight" id="insight">
      Waiting for enough live Volatility ticks.
    </p>

  </div>

  <div class="card">

    <div class="small-title">LIVE TICK FEED</div>

    <div class="feed" id="feed"></div>

  </div>

</div>

<script>

const DERIV_URL =
  "wss://api.derivws.com/trading/v1/options/ws/public";

const markets = [
  "R_10",
  "1HZ10V",
  "R_25",
  "1HZ25V",
  "R_50",
  "1HZ50V",
  "R_75",
  "1HZ75V",
  "R_100",
  "1HZ100V"
];

let ws = null;

let running = false;
let collecting = false;

let ticks = [];
let counts = Array(10).fill(0);

let startTime = 0;
let endTime = 0;

let timerInterval = null;

let selectedMarket = "1HZ100V";

const statusEl = document.getElementById("status");
const statusDot = document.getElementById("statusDot");

const marketEl = document.getElementById("market");
const windowEl = document.getElementById("window");

const startBtn = document.getElementById("startBtn");
const nextBtn = document.getElementById("nextBtn");

const timerEl = document.getElementById("timer");

const candidateEl = document.getElementById("candidate");
const edgeEl = document.getElementById("edge");
const confidenceEl = document.getElementById("confidence");

const sampleEl = document.getElementById("sample");
const matchesEl = document.getElementById("matches");
const differsEl = document.getElementById("differs");
const gapEl = document.getElementById("gap");

const digitsEl = document.getElementById("digits");
const insightEl = document.getElementById("insight");
const feedEl = document.getElementById("feed");


function setStatus(text, error = false) {

  statusEl.textContent = text;

  if (error) {
    statusDot.style.background = "#ff7b72";
    statusEl.classList.add("error");
  } else {
    statusDot.style.background = "#7ee787";
    statusEl.classList.remove("error");
  }

}


function connect() {

  setStatus("Connecting to Deriv...");

  ws = new WebSocket(DERIV_URL);

  ws.onopen = function() {

    running = true;

    setStatus("Connected — loading Volatility markets...");

    ws.send(JSON.stringify({
      active_symbols: "brief",
      req_id: 1
    }));

  };


  ws.onmessage = function(event) {

    try {

      const data = JSON.parse(event.data);

      if (data.error) {

        setStatus(
          "API error: " + data.error.message,
          true
        );

        return;
      }


      if (data.msg_type === "active_symbols") {

        const available =
          data.active_symbols || [];

        const found =
          available.filter(x =>
            markets.includes(x.underlying_symbol)
          );

        if (found.length === 0) {

          setStatus(
            "No Volatility markets returned",
            true
          );

          return;
        }

        setStatus("Connected — Volatility ready");

        subscribe();

      }


      if (data.msg_type === "tick") {

        receiveTick(data.tick);

      }

    } catch (error) {

      console.log(error);

    }

  };


  ws.onerror = function() {

    setStatus("Connection error", true);

  };


  ws.onclose = function() {

    if (running) {

      setStatus("Disconnected — reconnecting...");

      setTimeout(connect, 2000);

    }

  };

}


function subscribe() {

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    return;
  }

  ws.send(JSON.stringify({

    forget_all: "ticks"

  }));

  ws.send(JSON.stringify({

    ticks: selectedMarket,
    subscribe: 1,
    req_id: 2

  }));

}


function receiveTick(tick) {

  if (!tick) return;

  const quote = Number(tick.quote);

  if (!Number.isFinite(quote)) return;

  const priceString = String(tick.quote);

  let digit = 0;

  if (priceString.includes(".")) {

    const decimal =
      priceString.split(".")[1];

    digit =
      Number(decimal.slice(-1));

  } else {

    digit =
      Number(priceString.slice(-1));

  }

  if (digit < 0 || digit > 9) return;


  const time =
    new Date().toLocaleTimeString();


  feedEl.insertAdjacentHTML(
    "afterbegin",
    `<div>${time} → ${quote} → digit ${digit}</div>`
  );


  while (feedEl.children.length > 25) {

    feedEl.removeChild(feedEl.lastChild);

  }


  if (!collecting) return;


  ticks.push({
    digit: digit,
    price: quote,
    time: Date.now()
  });

  counts[digit]++;

  sampleEl.textContent = ticks.length;

  renderDigits();

}


function startAnalysis() {

  if (collecting) return;

  ticks = [];
  counts = Array(10).fill(0);

  candidateEl.textContent = "—";
  edgeEl.textContent = "COLLECTING";
  confidenceEl.textContent = "—";

  matchesEl.textContent = "—";
  differsEl.textContent = "—";
  gapEl.textContent = "—";

  insightEl.textContent =
    "Collecting live Volatility ticks and measuring digit behavior...";

  sampleEl.textContent = "0";

  renderDigits();

  const duration =
    Number(windowEl.value);

  startTime = Date.now();
  endTime = startTime + duration;

  collecting = true;

  startBtn.textContent = "RUNNING...";
  startBtn.disabled = true;

  nextBtn.disabled = true;

  updateTimer();

  clearInterval(timerInterval);

  timerInterval =
    setInterval(updateTimer, 100);

}


function updateTimer() {

  if (!collecting) return;

  const remaining =
    Math.max(0, endTime - Date.now());

  const seconds =
    Math.ceil(remaining / 1000);

  const mins =
    Math.floor(seconds / 60);

  const secs =
    seconds % 60;

  timerEl.textContent =
    String(mins).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");


  if (remaining <= 0) {

    finishAnalysis();

  }

}


function finishAnalysis() {

  if (!collecting) return;

  collecting = false;

  clearInterval(timerInterval);

  timerEl.textContent = "DONE";

  startBtn.textContent = "START";
  startBtn.disabled = false;

  nextBtn.disabled = false;

  calculateEdge();

}


function calculateEdge() {

  const total = ticks.length;

  if (total < 20) {

    edgeEl.textContent = "NO CLEAR EDGE";

    confidenceEl.textContent = "LOW";

    insightEl.textContent =
      "Not enough ticks were collected. A stronger sample is required before treating any digit as a candidate.";

    return;

  }


  const scores = [];


  const recentCount =
    Math.min(30, total);

  const recent =
    ticks.slice(-recentCount);


  const recentCounts =
    Array(10).fill(0);

  recent.forEach(t =>
    recentCounts[t.digit]++
  );


  for (let digit = 0; digit <= 9; digit++) {

    const frequency =
      counts[digit] / total;

    const recentFrequency =
      recentCounts[digit] / recentCount;


    let consistency = 0;

    const sectionSize =
      Math.floor(total / 3);


    for (let section = 0; section < 3; section++) {

      const from =
        section * sectionSize;

      const to =
        section === 2
          ? total
          : from + sectionSize;

      const sectionTicks =
        ticks.slice(from, to);

      if (sectionTicks.length === 0)
        continue;

      const appearances =
        sectionTicks.filter(
          t => t.digit === digit
        ).length;

      const rate =
        appearances / sectionTicks.length;

      if (rate >= 0.10) {
        consistency++;
      }

    }


    const lastTen =
      ticks.slice(-10);

    const cluster =
      lastTen.filter(
        t => t.digit === digit
      ).length;


    const score =
      (frequency * 100 * 0.45) +
      (recentFrequency * 100 * 0.30) +
      (consistency * 4) +
      (cluster * 2);


    scores.push({
      digit,
      score,
      frequency,
      recentFrequency
    });

  }


  scores.sort(
    (a, b) => b.score - a.score
  );


  const best =
    scores[0];

  const second =
    scores[1];


  const edgeGap =
    best.score - second.score;


  gapEl.textContent =
    edgeGap.toFixed(1);


  const matchesRate =
    best.frequency * 100;

  const differsRate =
    100 - matchesRate;


  matchesEl.textContent =
    matchesRate.toFixed(1) + "%";

  differsEl.textContent =
    differsRate.toFixed(1) + "%";


  let confidence =
    45 + edgeGap * 1.5;


  if (total >= 30)
    confidence += 5;

  if (total >= 60)
    confidence += 5;

  if (total >= 100)
    confidence += 5;


  if (
    best.recentFrequency >
    best.frequency
  ) {

    confidence += 8;

  }


  confidence =
    Math.min(90, confidence);


  candidateEl.textContent =
    best.digit;


  confidenceEl.textContent =
    Math.round(confidence) + "%";


  if (edgeGap < 3) {

    edgeEl.textContent =
      "NO CLEAR EDGE";

  } else if (edgeGap < 6) {

    edgeEl.textContent =
      "WEAK EDGE";

  } else if (edgeGap < 10) {

    edgeEl.textContent =
      "MODERATE EDGE";

  } else {

    edgeEl.textContent =
      "STRONGER EDGE";

  }


  insightEl.textContent =
    "Candidate digit " +
    best.digit +
    " has the highest combined score from frequency, recent activity, consistency and clustering. This is a statistical candidate, not a guaranteed next digit.";


  renderDigits(scores);

}


function renderDigits(ranking = null) {

  digitsEl.innerHTML = "";


  let order =
    ranking ||
    Array.from(
      { length: 10 },
      (_, digit) => ({
        digit
      })
    );


  order.forEach(item => {

    const digit =
      item.digit;

    const count =
      counts[digit];

    const total =
      ticks.length;

    const rate =
      total > 0
        ? ((count / total) * 100).toFixed(0)
        : "0";


    const box =
      document.createElement("div");

    box.className =
      "digit-box";


    box.innerHTML =
      digit +
      "<strong>" +
      rate +
      "%</strong>";


    digitsEl.appendChild(box);

  });

}


startBtn.addEventListener(
  "click",
  startAnalysis
);


nextBtn.addEventListener(
  "click",
  startAnalysis
);


marketEl.addEventListener(
  "change",
  function() {

    selectedMarket =
      marketEl.value;

    if (collecting) {

      finishAnalysis();

    }

    candidateEl.textContent = "—";
    edgeEl.textContent = "WAITING";
    confidenceEl.textContent = "—";

    if (ws &&
        ws.readyState === WebSocket.OPEN) {

      subscribe();

    }

  }
);


connect();

</script>

</body>
</html>
