<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader Pro</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:520px;
  margin:auto;
  padding:18px;
}

h1{
  text-align:center;
  margin:5px 0;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:18px;
}

.card{
  background:#111;
  border:1px solid #292929;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

label{
  display:block;
  color:#aaa;
  font-size:14px;
  margin-bottom:7px;
}

select,button{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#181818;
  color:white;
  font-size:16px;
}

button{
  background:white;
  color:black;
  font-weight:bold;
}

.connection{
  text-align:center;
  padding:18px;
  background:#090909;
  border-radius:12px;
}

.connection-state{
  font-size:22px;
  font-weight:bold;
}

.connection-detail{
  margin-top:8px;
  color:#aaa;
  font-size:13px;
}

.signal{
  text-align:center;
  font-size:31px;
  font-weight:bold;
  padding:25px 5px;
}

.status{
  text-align:center;
  color:#aaa;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#181818;
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.stat span{
  display:block;
  color:#777;
  font-size:12px;
  margin-bottom:5px;
}

.stat strong{
  font-size:20px;
}

.log{
  background:#070707;
  border-radius:10px;
  padding:12px;
  font-size:12px;
  color:#aaa;
  line-height:1.7;
  max-height:230px;
  overflow:auto;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="container">

<h1>Trader Pro</h1>

<div class="subtitle">
Expert Pattern Engine • One Round Mode
</div>

<div class="card">

<label>Volatility Market</label>

<select id="symbol">
  <option value="1HZ10V">Volatility 10 (1s)</option>
  <option value="1HZ25V">Volatility 25 (1s)</option>
  <option value="1HZ50V">Volatility 50 (1s)</option>
  <option value="1HZ75V">Volatility 75 (1s)</option>
  <option value="1HZ100V">Volatility 100 (1s)</option>
  <option value="R_10">Volatility 10</option>
  <option value="R_25">Volatility 25</option>
  <option value="R_50">Volatility 50</option>
  <option value="R_75">Volatility 75</option>
  <option value="R_100">Volatility 100</option>
</select>

<label>Contract Duration</label>

<select id="duration">
  <option value="1">1 Tick</option>
  <option value="2">2 Ticks</option>
  <option value="3">3 Ticks</option>
  <option value="4">4 Ticks</option>
  <option value="5">5 Ticks</option>
  <option value="6">6 Ticks</option>
  <option value="7">7 Ticks</option>
  <option value="8">8 Ticks</option>
  <option value="9">9 Ticks</option>
  <option value="10">10 Ticks</option>
</select>

<button id="startBtn">
START EXPERT ANALYSIS
</button>

</div>


<div class="card">

<div class="connection">

<div id="connectionState"
class="connection-state">
🟡 CONNECTING
</div>

<div id="connectionDetail"
class="connection-detail">
Opening Deriv market-data connection...
</div>

</div>

</div>


<div class="card">

<div id="signal"
class="signal">
WAITING...
</div>

<div id="status"
class="status">
Starting...
</div>

</div>


<div class="card">

<div class="stats">

<div class="stat">
<span>Historical</span>
<strong id="historical">0</strong>
</div>

<div class="stat">
<span>Live ticks</span>
<strong id="liveTicks">0</strong>
</div>

<div class="stat">
<span>Signals</span>
<strong id="signals">0</strong>
</div>

<div class="stat">
<span>Wins</span>
<strong id="wins">0</strong>
</div>

<div class="stat">
<span>Losses</span>
<strong id="losses">0</strong>
</div>

<div class="stat">
<span>Hit rate</span>
<strong id="hitRate">0%</strong>
</div>

</div>

</div>


<div class="card">

<b>Deriv Connection Log</b>

<div id="log" class="log">
Starting...
</div>

</div>

</div>


<script>

/*
  CURRENT DERIV PUBLIC MARKET DATA ENDPOINT
*/

const WS_URL =
"wss://api.derivws.com/trading/v1/options/ws/public";


let ws = null;

let requestedSymbol = null;
let actualSymbol = null;

let history = [];
let live = [];

let running = false;

let signalDigit = null;
let signalStart = 0;

let duration = 1;

let signals = 0;
let wins = 0;
let losses = 0;

let lastLossDigit = null;

let pipSize = 2;

let reconnectTimer = null;


/* ELEMENTS */

const symbolEl =
document.getElementById("symbol");

const durationEl =
document.getElementById("duration");

const startBtn =
document.getElementById("startBtn");

const connectionState =
document.getElementById("connectionState");

const connectionDetail =
document.getElementById("connectionDetail");

const signalEl =
document.getElementById("signal");

const statusEl =
document.getElementById("status");

const logEl =
document.getElementById("log");


/* LOG */

function log(message){

  const time =
  new Date().toLocaleTimeString();

  logEl.innerHTML =
    time +
    " — " +
    message +
    "<br>" +
    logEl.innerHTML;

}


/* CONNECTION STATUS */

function setConnection(state,detail){

  connectionState.textContent =
    state;

  connectionDetail.textContent =
    detail;

}


/* SEND REQUEST */

function sendRequest(request){

  if(
    !ws ||
    ws.readyState !== WebSocket.OPEN
  ){

    log(
      "Cannot send request: socket not open"
    );

    return false;
  }

  try{

    ws.send(
      JSON.stringify(request)
    );

    log(
      "Sent: " +
      JSON.stringify(request)
    );

    return true;

  }catch(error){

    log(
      "Send error: " +
      error.message
    );

    return false;

  }

}


/* CONNECT */

function connect(){

  clearTimeout(
    reconnectTimer
  );

  setConnection(
    "🟡 CONNECTING",
    "Opening Deriv public market-data connection..."
  );

  statusEl.textContent =
    "Connecting to Deriv...";

  log(
    "Opening WebSocket..."
  );


  try{

    ws =
    new WebSocket(
      WS_URL
    );

  }catch(error){

    setConnection(
      "🔴 ERROR",
      error.message
    );

    log(
      "WebSocket error: " +
      error.message
    );

    scheduleReconnect();

    return;

  }


  ws.onopen =
  function(){

    setConnection(
      "🟢 CONNECTED",
      "Connected • Requesting active markets"
    );

    statusEl.textContent =
      "Connected • Finding market...";

    log(
      "WebSocket connected successfully"
    );


    /*
      IMPORTANT:
      Get active symbols FIRST.
    */

    sendRequest({

      active_symbols:
        "brief",

      req_id:1

    });

  };


  ws.onmessage =
  function(event){

    let data;

    try{

      data =
      JSON.parse(
        event.data
      );

    }catch(error){

      log(
        "Could not read Deriv response"
      );

      return;

    }


    /*
      ERROR
    */

    if(data.error){

      const message =
        data.error.message ||
        data.error.code ||
        "Unknown Deriv error";

      setConnection(
        "🔴 DERIV ERROR",
        message
      );

      statusEl.textContent =
        "Deriv rejected a request";

      log(
        "DERIV ERROR: " +
        message
      );

      if(data.echo_req){

        log(
          "Rejected request: " +
          JSON.stringify(
            data.echo_req
          )
        );

      }

      return;

    }


    /*
      ACTIVE SYMBOLS
    */

    if(
      data.msg_type ===
      "active_symbols"
    ){

      log(
        "Active-symbol response received"
      );


      const markets =
      data.active_symbols || [];


      log(
        "Markets returned: " +
        markets.length
      );


      const wanted =
        symbolEl.value;


      const found =
      markets.find(
        item =>
          item.underlying_symbol ===
          wanted
      );


      if(!found){

        setConnection(
          "🔴 MARKET NOT FOUND",
          wanted +
          " was not returned by Deriv"
        );

        log(
          "Selected symbol not found: " +
          wanted
        );

        return;

      }


      actualSymbol =
        found.underlying_symbol;


      if(
        found.pip_size !== undefined
      ){

        pipSize =
          Number(
            found.pip_size
          );

      }


      setConnection(
        "🟢 MARKET FOUND",
        actualSymbol +
        " • Requesting history"
      );


      log(
        "Using symbol: " +
        actualSymbol
      );


      /*
        HISTORY REQUEST
      */

      sendRequest({

        ticks_history:
          actualSymbol,

        end:
          "latest",

        count:
          1000,

        style:
          "ticks",

        req_id:
          2

      });


      /*
        LIVE SUBSCRIPTION
      */

      sendRequest({

        ticks:
          actualSymbol,

        subscribe:
          1,

        req_id:
          3

      });


      return;

    }


    /*
      HISTORY
    */

    if(
      data.msg_type ===
      "history"
    ){

      history = [];


      if(
        data.pip_size !== undefined
      ){

        pipSize =
          Number(
            data.pip_size
          );

      }


      const prices =
      data.history &&
      data.history.prices
      ? data.history.prices
      : [];


      for(
        const price of prices
      ){

        history.push(
          digitFromQuote(
            price
          )
        );

      }


      document.getElementById(
        "historical"
      ).textContent =
      history.length;


      log(
        "Historical ticks loaded: " +
        history.length
      );


      setConnection(
        "🟢 CONNECTED",
        "History loaded • Waiting for live ticks"
      );


      return;

    }


    /*
      LIVE TICK
    */

    if(
      data.msg_type ===
      "tick"
    ){

      if(
        !data.tick
      ){

        log(
          "Tick response contained no tick data"
        );

        return;

      }


      if(
        data.tick.pip_size !== undefined
      ){

        pipSize =
          Number(
            data.tick.pip_size
          );

      }


      const digit =
      digitFromQuote(
        data.tick.quote
      );


      live.push(
        digit
      );


      if(
        live.length > 1500
      ){

        live.shift();

      }


      document.getElementById(
        "liveTicks"
      ).textContent =
      live.length;


      setConnection(
        "🟢 LIVE",
        "Receiving live ticks • " +
        actualSymbol
      );


      statusEl.textContent =
        "LIVE • Last digit: " +
        digit;


      log(
        "LIVE TICK • " +
        data.tick.quote +
        " • digit " +
        digit
      );


      processTick();

      return;

    }

  };


  ws.onerror =
  function(){

    setConnection(
      "🔴 CONNECTION ERROR",
      "Browser WebSocket error"
    );

    statusEl.textContent =
      "Connection error";

    log(
      "WebSocket error event"
    );

  };


  ws.onclose =
  function(event){

    setConnection(
      "🔴 DISCONNECTED",
      "Connection closed • code " +
      event.code
    );

    statusEl.textContent =
      "Deriv connection closed";

    log(
      "WebSocket closed • code " +
      event.code
    );


    scheduleReconnect();

  };

}


/* RECONNECT */

function scheduleReconnect(){

  clearTimeout(
    reconnectTimer
  );

  reconnectTimer =
  setTimeout(
    function(){

      log(
        "Reconnecting..."
      );

      connect();

    },
    3000
  );

}


/* DIGIT */

function digitFromQuote(
  quote
){

  const decimals =
    Number.isFinite(
      Number(pipSize)
    )
    ? Number(pipSize)
    : 2;


  const text =
    Number(
      quote
    ).toFixed(
      decimals
    );


  const parts =
    text.split(".");


  const decimal =
    parts[1] || "0";


  return Number(
    decimal.charAt(
      decimal.length - 1
    )
  );

}


/* START */

startBtn.onclick =
function(){

  duration =
    Number(
      durationEl.value
    );


  if(!running){

    running = true;

    startBtn.textContent =
      "STOP EXPERT ANALYSIS";

    signalEl.textContent =
      "ANALYZING...";

    statusEl.textContent =
      "Scanning live market...";

    analyze();

  }else{

    running = false;

    signalDigit = null;

    startBtn.textContent =
      "START EXPERT ANALYSIS";

    signalEl.textContent =
      "STOPPED";

    statusEl.textContent =
      "Analysis stopped";

  }

};


/* TICK PROCESSING */

function processTick(){

  if(!running){
    return;
  }


  if(
    signalDigit === null
  ){

    analyze();

    return;

  }


  const elapsed =
    live.length -
    signalStart;


  if(
    elapsed >= duration
  ){

    const finalIndex =
      signalStart +
      duration -
      1;


    const finalDigit =
      live[
        finalIndex
      ];


    if(
      finalDigit ===
      signalDigit
    ){

      wins++;

      log(
        "WIN • Matches " +
        signalDigit +
        " • Final " +
        finalDigit
      );

    }else{

      losses++;

      lastLossDigit =
        signalDigit;

      log(
        "LOSS • Matches " +
        signalDigit +
        " • Final " +
        finalDigit
      );

    }


    signals++;

    signalDigit =
      null;


    updateStats();


    signalEl.textContent =
      "ANALYZING...";


    setTimeout(
      function(){

        if(running){
          analyze();
        }

      },
      1200
    );

  }

}


/* ANALYSIS */

function analyze(){

  if(!running){
    return;
  }


  const combined =
    history
    .concat(live)
    .slice(-1200);


  if(
    combined.length < 500
  ){

    signalEl.textContent =
      "LOADING DATA";

    statusEl.textContent =
      "Need more market history";

    return;

  }


  const counts =
    Array(10).fill(0);


  for(
    const digit of combined
  ){

    counts[digit]++;

  }


  const recent =
    combined.slice(-100);


  const recentCounts =
    Array(10).fill(0);


  for(
    const digit of recent
  ){

    recentCounts[digit]++;

  }


  const candidates=[];


  for(
    let digit=0;
    digit<10;
    digit++
  ){

    if(
      digit ===
      lastLossDigit
    ){

      continue;

    }


    const longRate =
      counts[digit] /
      combined.length;


    const recentRate =
      recentCounts[digit] /
      recent.length;


    const score =
      longRate * 0.5 +
      recentRate * 0.5;


    candidates.push({

      digit:
        digit,

      long:
        longRate,

      recent:
        recentRate,

      score:
        score

    });

  }


  candidates.sort(
    (a,b) =>
      b.score -
      a.score
  );


  const best =
    candidates[0];


  const second =
    candidates[1];


  if(!best || !second){
    return;
  }


  const qualified =
    best.long >= 0.105 &&
    best.recent >= 0.105 &&
    (
      best.long -
      second.long
    ) >= 0.010;


  if(!qualified){

    signalEl.textContent =
      "NO CLEAR EDGE";

    statusEl.textContent =
      "Analyzing • No qualifying digit";

    return;

  }


  signalDigit =
    best.digit;


  signalStart =
    live.length;


  signalEl.textContent =
    "MATCHES " +
    signalDigit;


  statusEl.textContent =
    "QUALIFIED • " +
    duration +
    " tick round";


  log(
    "SIGNAL LOCKED • MATCHES " +
    signalDigit
  );

}


/* STATS */

function updateStats(){

  document.getElementById(
    "signals"
  ).textContent =
  signals;


  document.getElementById(
    "wins"
  ).textContent =
  wins;


  document.getElementById(
    "losses"
  ).textContent =
  losses;


  const completed =
    wins + losses;


  const rate =
    completed > 0
    ? (
        wins /
        completed *
        100
      ).toFixed(1)
    : "0";


  document.getElementById(
    "hitRate"
  ).textContent =
  rate + "%";

}


/* CHANGE MARKET */

symbolEl.onchange =
function(){

  history=[];
  live=[];

  signalDigit=null;

  actualSymbol=null;

  document.getElementById(
    "historical"
  ).textContent="0";

  document.getElementById(
    "liveTicks"
  ).textContent="0";


  if(ws){

    try{
      ws.close();
    }catch(e){}

  }


  connect();

};


/* START CONNECTION */

connect();

</script>

</body>
</html>
