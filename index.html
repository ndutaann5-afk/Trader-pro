<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080b10;
color:white;
font-family:Arial,sans-serif
}

.app{
max-width:700px;
margin:auto;
padding:18px
}

h1{margin:0;font-size:28px}

.subtitle{
color:#8d98a8;
margin:5px 0 20px
}

.card{
background:#11161e;
border:1px solid #252c36;
border-radius:14px;
padding:16px;
margin-bottom:14px
}

label{
display:block;
color:#9ca8b8;
font-size:13px;
margin-bottom:7px
}

select{
width:100%;
padding:13px;
border-radius:9px;
border:1px solid #303846;
background:#080b10;
color:white;
font-size:15px
}

.status{
display:flex;
align-items:center;
gap:8px;
font-size:14px
}

.dot{
width:9px;
height:9px;
border-radius:50%;
background:#7ee787
}

.timer{
text-align:center;
font-size:32px;
font-weight:bold;
margin:12px 0 15px
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

button{
width:100%;
border:0;
border-radius:10px;
padding:14px;
font-size:15px;
font-weight:bold;
cursor:pointer;
background:white;
color:black
}

button.secondary{
background:#252c36;
color:white
}

button:disabled{
opacity:.45
}

.main-result{
text-align:center;
padding:25px 10px
}

.small-title{
color:#8995a5;
font-size:13px;
letter-spacing:1px
}

.digit{
font-size:76px;
font-weight:bold;
margin:8px 0
}

.edge{
font-size:17px;
font-weight:bold
}

.confidence{
margin-top:7px;
color:#b8c2cf
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.stat{
background:#0b0f15;
border-radius:10px;
padding:13px
}

.stat-name{
color:#8995a5;
font-size:12px
}

.stat-value{
font-size:20px;
font-weight:bold;
margin-top:5px
}

.digits{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:5px;
margin-top:10px
}

.digit-box{
background:#0b0f15;
border-radius:6px;
text-align:center;
padding:8px 2px;
font-size:12px
}

.digit-box strong{
display:block;
font-size:14px;
margin-top:3px
}

.insight{
color:#b9c3d0;
line-height:1.5;
font-size:14px
}

.feed{
max-height:180px;
overflow-y:auto;
font-family:monospace;
font-size:13px;
color:#aeb8c6
}

.feed div{
padding:5px 0;
border-bottom:1px solid #1c222b
}
</style>
</head>

<body>

<div class="app">

<h1>TRADER PRO</h1>

<div class="subtitle">
Deriv Volatility Matches Edge Engine
</div>


<div class="card">

<div class="status">
<span class="dot" id="dot"></span>
<span id="status">Connecting to Deriv...</span>
</div>

</div>


<div class="card">

<label>VOLATILITY INDEX</label>

<select id="market">

<option value="1HZ100V">
Volatility 100 (1s)
</option>

<option value="1HZ75V">
Volatility 75 (1s)
</option>

<option value="1HZ50V">
Volatility 50 (1s)
</option>

<option value="1HZ25V">
Volatility 25 (1s)
</option>

<option value="1HZ10V">
Volatility 10 (1s)
</option>

<option value="R_100">
Volatility 100
</option>

<option value="R_75">
Volatility 75
</option>

<option value="R_50">
Volatility 50
</option>

<option value="R_25">
Volatility 25
</option>

<option value="R_10">
Volatility 10
</option>

</select>

</div>


<div class="card">

<label>ANALYSIS WINDOW</label>

<select id="window">

<option value="40000" selected>
40 Seconds
</option>

<option value="30000">
30 Seconds
</option>

<option value="60000">
1 Minute
</option>

<option value="120000">
2 Minutes
</option>

</select>


<div class="timer" id="timer">
00:40
</div>


<div class="buttons">

<button id="start">
START
</button>

<button id="next" class="secondary" disabled>
NEXT ANALYSIS
</button>

</div>

</div>


<div class="card main-result">

<div class="small-title">
MATCHES CANDIDATE
</div>

<div class="digit" id="candidate">
—
</div>

<div class="edge" id="edge">
WAITING
</div>

<div class="confidence">
Confidence:
<span id="confidence">—</span>
</div>

</div>


<div class="card">

<div class="grid">

<div class="stat">

<div class="stat-name">
TICKS
</div>

<div class="stat-value" id="sample">
0
</div>

</div>


<div class="stat">

<div class="stat-name">
MATCHES RATE
</div>

<div class="stat-value" id="matches">
—
</div>

</div>


<div class="stat">

<div class="stat-name">
DIFFERS RATE
</div>

<div class="stat-value" id="differs">
—
</div>

</div>


<div class="stat">

<div class="stat-name">
EDGE GAP
</div>

<div class="stat-value" id="gap">
—
</div>

</div>

</div>

</div>


<div class="card">

<div class="small-title">
DIGIT DISTRIBUTION
</div>

<div class="digits" id="digits">
</div>

</div>


<div class="card">

<div class="small-title">
AI / STATISTICAL INSIGHT
</div>

<p class="insight" id="insight">

Waiting for live Volatility ticks.

</p>

</div>


<div class="card">

<div class="small-title">
LIVE TICK FEED
</div>

<div class="feed" id="feed">
</div>

</div>

</div>


<script>

const URL =
"wss://api.derivws.com/trading/v1/options/ws/public";

let ws=null;

let collecting=false;

let ticks=[];

let counts=Array(10).fill(0);

let endTime=0;

let timer=null;

let symbol="1HZ100V";


const status=
document.getElementById("status");

const dot=
document.getElementById("dot");

const market=
document.getElementById("market");

const windowSelect=
document.getElementById("window");

const start=
document.getElementById("start");

const next=
document.getElementById("next");

const timerDisplay=
document.getElementById("timer");

const candidate=
document.getElementById("candidate");

const edge=
document.getElementById("edge");

const confidence=
document.getElementById("confidence");

const sample=
document.getElementById("sample");

const matches=
document.getElementById("matches");

const differs=
document.getElementById("differs");

const gap=
document.getElementById("gap");

const digits=
document.getElementById("digits");

const insight=
document.getElementById("insight");

const feed=
document.getElementById("feed");


function setStatus(message,error=false){

status.textContent=message;

dot.style.background=
error ? "#ff7b72" : "#7ee787";

}


function connect(){

setStatus("Connecting to Deriv...");

ws=new WebSocket(URL);


ws.onopen=()=>{

setStatus("Connected — loading Volatility...");

ws.send(JSON.stringify({

active_symbols:"brief",

req_id:1

}));

};


ws.onmessage=(event)=>{

const data=JSON.parse(event.data);


if(data.error){

setStatus(
"API error: "+data.error.message,
true
);

return;

}


if(data.msg_type==="active_symbols"){

setStatus(
"Connected — Volatility ready"
);

subscribe();

}


if(data.msg_type==="tick"){

receiveTick(data.tick);

}

};


ws.onerror=()=>{

setStatus(
"Connection error",
true
);

};

}


function subscribe(){

if(!ws ||
ws.readyState!==WebSocket.OPEN)
return;


ws.send(JSON.stringify({

forget_all:"ticks"

}));


ws.send(JSON.stringify({

ticks:symbol,

subscribe:1,

req_id:2

}));

}


function getDigit(quote){

const text=String(quote);

if(text.includes(".")){

const decimal=
text.split(".")[1];

return Number(
decimal.slice(-1)
);

}

return Number(
text.slice(-1)
);

}


function receiveTick(tick){

if(!tick)return;

const quote=
Number(tick.quote);

if(!Number.isFinite(quote))
return;


const digit=
getDigit(tick.quote);


const time=
new Date().toLocaleTimeString();


feed.insertAdjacentHTML(
"afterbegin",
`<div>${time} → ${quote} → digit ${digit}</div>`
);


while(feed.children.length>25){

feed.removeChild(feed.lastChild);

}


if(!collecting)return;


ticks.push({

digit:digit,

price:quote,

time:Date.now()

});


counts[digit]++;

sample.textContent=
ticks.length;

renderDigits();

}


function startAnalysis(){

if(collecting)return;


ticks=[];

counts=Array(10).fill(0);


candidate.textContent="—";

edge.textContent="COLLECTING";

confidence.textContent="—";

matches.textContent="—";

differs.textContent="—";

gap.textContent="—";

sample.textContent="0";


insight.textContent=
"Collecting live Volatility ticks for 40 seconds...";


renderDigits();


const duration=
Number(windowSelect.value);


endTime=
Date.now()+duration;


collecting=true;


start.textContent=
"RUNNING...";

start.disabled=true;

next.disabled=true;


clearInterval(timer);

timer=
setInterval(updateTimer,100);


updateTimer();

}


function updateTimer(){

if(!collecting)return;


const remaining=
Math.max(
0,
endTime-Date.now()
);


const seconds=
Math.ceil(remaining/1000);


timerDisplay.textContent=
"00:"+String(seconds)
.padStart(2,"0");


if(remaining<=0){

finish();

}

}


function finish(){

if(!collecting)return;


collecting=false;

clearInterval(timer);


timerDisplay.textContent=
"DONE";

start.textContent=
"START";

start.disabled=false;

next.disabled=false;


calculate();

}


function calculate(){

const total=ticks.length;


if(total<20){

candidate.textContent="—";

edge.textContent=
"NO CLEAR EDGE";

confidence.textContent=
"LOW";

insight.textContent=
"Not enough ticks were collected to establish a useful statistical signal.";

return;

}


const recent=
ticks.slice(
-Math.min(30,total)
);


const recentCounts=
Array(10).fill(0);


recent.forEach(t=>{
recentCounts[t.digit]++;
});


const scores=[];


for(let d=0;d<=9;d++){

const frequency=
counts[d]/total;


const recentFrequency=
recentCounts[d]/recent.length;


let consistency=0;


const sectionSize=
Math.floor(total/3);


for(let s=0;s<3;s++){

const from=
s*sectionSize;

const to=
s===2
? total
: from+sectionSize;


const section=
ticks.slice(from,to);


if(!section.length)continue;


const appearances=
section.filter(
t=>t.digit===d
).length;


if(
appearances/section.length>=0.10
){

consistency++;

}

}


const cluster=
ticks
.slice(-10)
.filter(
t=>t.digit===d
).length;


const score=

frequency*100*0.45+

recentFrequency*100*0.30+

consistency*4+

cluster*2;


scores.push({

digit:d,

score:score,

frequency:frequency,

recentFrequency:recentFrequency

});

}


scores.sort(
(a,b)=>b.score-a.score
);


const best=scores[0];

const second=scores[1];


const edgeGap=
best.score-second.score;


gap.textContent=
edgeGap.toFixed(1);


matches.textContent=
(best.frequency*100)
.toFixed(1)+"%";


differs.textContent=
((1-best.frequency)*100)
.toFixed(1)+"%";


let conf=
45+edgeGap*1.5;


if(total>=30)
conf+=5;


if(total>=60)
conf+=5;


if(best.recentFrequency>
best.frequency)
conf+=8;


conf=
Math.min(90,conf);


if(edgeGap<3){

candidate.textContent="—";

edge.textContent=
"NO CLEAR EDGE";

confidence.textContent=
Math.round(conf)+"%";

insight.textContent=
"Digit "+best.digit+
" is currently leading, but the separation from the other digits is too small. Wait.";

return;

}


candidate.textContent=
best.digit;


confidence.textContent=
Math.round(conf)+"%";


if(edgeGap<6){

edge.textContent=
"WEAK EDGE";

}else if(edgeGap<10){

edge.textContent=
"MODERATE EDGE";

}else{

edge.textContent=
"STRONGER EDGE";

}


insight.textContent=
"Digit "+best.digit+
" has the strongest combined statistical score from frequency, recent activity, consistency and clustering. This is a statistical signal, not a guaranteed next digit.";

renderRanking(scores);

}


function renderDigits(){

digits.innerHTML="";


for(let d=0;d<=9;d++){

const box=
document.createElement("div");

const rate=
ticks.length
?
(counts[d]/ticks.length*100)
.toFixed(0)
:"0";


box.className=
"digit-box";

box.innerHTML=
d+
"<strong>"+
rate+
"%</strong>";


digits.appendChild(box);

}

}


function renderRanking(scores){

digits.innerHTML="";


scores.forEach(item=>{

const box=
document.createElement("div");

const rate=
(item.frequency*100)
.toFixed(0);


box.className=
"digit-box";

box.innerHTML=
item.digit+
"<strong>"+
rate+
"%</strong>";


digits.appendChild(box);

});

}


start.addEventListener(
"click",
startAnalysis
);


next.addEventListener(
"click",
startAnalysis
);


market.addEventListener(
"change",
()=>{

symbol=
market.value;

if(ws &&
ws.readyState===WebSocket.OPEN){

subscribe();

}

candidate.textContent="—";

edge.textContent="WAITING";

confidence.textContent="—";

});


connect();

</script>

</body>
</html>
